repos:
  - repo: local
    hooks:
      - id: rust-fmt
        name: Rust formatting
        entry: cargo fmt --all -- --check
        language: system
        pass_filenames: false
      - id: rust-clippy
        name: Rust clippy
        entry: cargo clippy --locked --all-targets -- -D warnings
        language: system
        pass_filenames: false
      - id: rust-coverage
        name: Production Rust coverage strictly above 95 percent
        entry: scripts/coverage.sh
        language: system
        pass_filenames: false
        always_run: true
      - id: cpp-parity
        name: Existing C++ test parity
        entry: scripts/parity.sh
        language: system
        pass_filenames: false
        always_run: true
