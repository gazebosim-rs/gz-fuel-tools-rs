name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master; toolchain pinned below
        with:
          toolchain: 1.92.0
          components: rustfmt, clippy, llvm-tools-preview
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - name: Check version agreement
        run: python3 scripts/check_versions.py
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Documentation and doctests
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo test --locked --doc
          cargo doc --locked --no-deps
      - name: Rust tests and coverage above 95 percent
        run: scripts/coverage.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: rust-coverage
          path: coverage/

  cpp:
    name: C++ compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CMAKE_PREFIX_PATH: ${{ github.workspace }}/.ci/install
      LD_LIBRARY_PATH: ${{ github.workspace }}/.ci/install/lib
      PKG_CONFIG_PATH: ${{ github.workspace }}/.ci/install/lib/pkgconfig
      FUEL_UPSTREAM_SOURCE: ${{ github.workspace }}/upstream-tests
      FUEL_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master; toolchain pinned below
        with:
          toolchain: 1.92.0
      - name: Install build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          build-essential cmake pkg-config libssl-dev libjsoncpp-dev
          libtinyxml2-dev libeigen3-dev libspdlog-dev uuid-dev
          libprotobuf-dev libprotoc-dev protobuf-compiler python3 ruby
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: gazebo
        with:
          path: .ci/install
          key: gazebo-ubuntu-24.04-${{ runner.arch }}-${{ hashFiles('scripts/ci/dependencies.lock', 'scripts/ci/build-dependencies.sh') }}
      - name: Build pinned Gazebo dependencies
        if: steps.gazebo.outputs.cache-hit != 'true'
        run: scripts/ci/build-dependencies.sh
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gazebosim/gz-fuel-tools
          ref: 6ac62b01d7d8af3ab23fd2239728a791704a3f09
          path: upstream-tests
          persist-credentials: false
      - name: Original and supplementary C++ tests and coverage above 95 percent
        run: scripts/parity.sh
      - name: Validate clean source package and relocated installation
        run: scripts/ci/release-checks.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: cpp-test-results
          path: |
            coverage/
            build/Testing/Temporary/
            build/release-checks/

  audit:
    name: Dependency and workflow policy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master; toolchain pinned below
        with:
          toolchain: 1.92.0
      - name: Lint workflow configuration
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          scripts/ci/lint-workflows.sh
      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Check advisories, licenses, bans and sources
        run: cargo deny --locked check

  required:
    name: CI required
    if: ${{ always() }}
    needs: [rust, cpp, audit]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every test job to succeed
        env:
          RUST_RESULT: ${{ needs.rust.result }}
          CPP_RESULT: ${{ needs.cpp.result }}
          AUDIT_RESULT: ${{ needs.audit.result }}
        run: |
          set -euo pipefail
          test "$RUST_RESULT" = success
          test "$CPP_RESULT" = success
          test "$AUDIT_RESULT" = success
