name: Rust and C++ compatibility
on: [push, pull_request]
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: scripts/coverage.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
  # The full Gazebo source/dependency workspace is required by unchanged C++ tests.
  # This gate also runs in the installed pre-commit hook.
  cpp:
    runs-on: [self-hosted, gazebo]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: gazebosim/gz-fuel-tools
          ref: 6ac62b01d7d8af3ab23fd2239728a791704a3f09
          path: upstream-tests
      - run: scripts/parity.sh
        env:
          FUEL_UPSTREAM_SOURCE: ${{ github.workspace }}/upstream-tests
